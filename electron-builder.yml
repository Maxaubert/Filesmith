appId: com.filesmith.app
productName: Filesmith
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,.prettierrc.yaml,.prettierignore,eslint.config.js,tsconfig*.json}'
  - '!{.git,.claude,docs,test}/*'
  # resources/ ships via extraResources below; without these excludes electron-
  # builder's default **/* also packs the whole 1.4 GB tree INTO app.asar,
  # doubling the installer. scripts/ and build/ are dev-only.
  - '!resources/**'
  - '!scripts/**'
  - '!build/**'
  - '!dist/**'
# Bundled core CLI tools (ffmpeg, ImageMagick, mutool, CaesiumCLT) ship in
# resources/bin; LibreOffice (document conversion) ships in resources/libreoffice.
# Both are populated by scripts/fetch-binaries.mjs before packaging.
extraResources:
  # The built-in model registry (layer 1). Data, not code: it defines which model
  # families exist, and ships in the installer so a fully offline install has a
  # complete catalog. The user's own layer lives in %APPDATA%/Filesmith/registry.
  - from: resources/registry
    to: registry
    filter: ['**/*.json']
  - from: resources/bin
    to: bin
    filter: ['**/*']
  - from: resources/libreoffice
    to: libreoffice
    filter: ['**/*']
  - from: resources/ghostscript
    to: ghostscript
    filter: ['**/*']
  - from: resources/realesrgan
    to: realesrgan
    filter: ['**/*']
  # PiD (NVIDIA) upscaler sidecar script. The heavy torch env + weights are
  # downloaded on first use to userData; only this launcher ships in the app.
  - from: resources/pid
    to: pid
    filter: ['**/*']
  # spandrel upscale sidecar (ComfyUI-imported models). Runs in the shared PiD
  # torch env; only this launcher ships in the app.
  - from: resources/spandrel
    to: spandrel
    filter: ['**/*']
win:
  target:
    - nsis
  artifactName: ${productName}-Setup-${arch}-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
