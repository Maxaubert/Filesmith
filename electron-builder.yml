appId: com.filesmith.app
productName: Filesmith
directories:
  buildResources: build
  output: dist
# An ALLOWLIST, not a denylist: the old exclude list named eslint.config.js
# (the repo has .mjs) and missed vitest.config.ts, so stray dev files rode
# into app.asar — and every new top-level file would too. Only the built app
# belongs in the archive; resources/ ships via extraResources below.
files:
  - 'out/**/*'
  - 'package.json'
# Bundled core CLI tools (ffmpeg, ImageMagick, mutool, CaesiumCLT) ship in
# resources/bin; LibreOffice (document conversion) ships in resources/libreoffice.
# Both are populated by scripts/fetch-binaries.mjs before packaging.
extraResources:
  # The built-in model registry (layer 1). Data, not code: it defines which model
  # families exist, and ships in the installer so a fully offline install has a
  # complete catalog. The user's own layer lives in %APPDATA%/Filesmith/registry.
  - from: resources/registry
    to: registry
    filter: ['**/*.json']
  - from: resources/bin
    to: bin
    filter: ['**/*']
  - from: resources/libreoffice
    to: libreoffice
    filter: ['**/*']
  - from: resources/ghostscript
    to: ghostscript
    filter: ['**/*']
  - from: resources/realesrgan
    to: realesrgan
    filter: ['**/*']
  # PiD (NVIDIA) upscaler sidecar script. The heavy torch env + weights are
  # downloaded on first use to userData; only this launcher ships in the app.
  - from: resources/pid
    to: pid
    filter: ['**/*']
  # spandrel upscale sidecar (ComfyUI-imported models). Runs in the shared PiD
  # torch env; only this launcher ships in the app.
  - from: resources/spandrel
    to: spandrel
    filter: ['**/*']
win:
  target:
    - nsis
  artifactName: ${productName}-Setup-${arch}-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  # Setup draws its own directory page (build/installer/pages.nsh), so MUI's is
  # off. allowElevation off keeps it per-user, the only mode Filesmith has.
  allowToChangeInstallationDirectory: false
  allowElevation: false
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: false
  createStartMenuShortcut: true
