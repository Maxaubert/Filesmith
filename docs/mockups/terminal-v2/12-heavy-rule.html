<!doctype html>
<!--
  Filesmith terminal v2, mockup 12: One heavy rule
  Pitch: the navigation is the title. "Convert" sits large and white on one baseline with the
  six other verbs in small grey mono, and a single 2px white rule underlines that line. It is the
  only line on screen. No fills, no pills except the one white action that echoes the rule.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Filesmith Heavy Rule</title>
<style>
  :root{
    --bg:#000; --fg:#f2f2f2; --fg2:#d0d0d0; --fg3:#8f8f8f; --glyph:#b0b0b0;
    --hover:#121212;
    --s:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
    --m:"Cascadia Mono",Consolas,monospace;
    --ease:cubic-bezier(.2,.7,.2,1);
    --col:720px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{color:var(--fg);font:13px/1.4 var(--m);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--fg);outline-offset:2px}
  button:active{transform:scale(.97)}

  .app{width:1440px;height:900px;position:relative;overflow:hidden;background:var(--bg)}

  /* title bar */
  .bar{height:38px;display:flex;align-items:center;padding-left:14px;gap:9px;color:var(--fg3);font:12px var(--s)}
  .bar svg{display:block}
  .win{margin-left:auto;display:flex;height:100%}
  .win button{width:46px;height:100%;display:grid;place-items:center;color:var(--glyph);transition:background-color .14s var(--ease)}
  .win button:hover{background:var(--hover)}

  /* one left column */
  .col{width:var(--col);margin:150px 0 0 160px}

  /* navigation is the title line */
  .verbs{display:flex;align-items:baseline;gap:26px}
  .verbs button{font-size:12.5px;font-weight:500;color:var(--fg3);border-radius:4px;transition:color .14s var(--ease)}
  .verbs button:hover{color:var(--fg)}
  .verbs button[aria-current]{font:600 34px/1 var(--s);letter-spacing:-.01em;color:var(--fg);margin-right:14px}

  .rule{height:2px;background:var(--fg);margin:20px 0 26px}

  .q{list-style:none}
  .q li{height:44px;display:flex;align-items:center;justify-content:space-between;color:var(--fg2);font-variant-numeric:tabular-nums}
  .q .st{color:var(--fg3)}
  .q .now .nm,.q .now .st{color:var(--fg)}
  .q .bad .nm{color:var(--fg)}
  .q .bad .st{color:var(--fg);font-weight:700}

  .fmt{margin-top:64px;display:flex;gap:28px}
  .fmt button{color:var(--fg3);border-radius:4px;transition:color .14s var(--ease)}
  .fmt button:hover{color:var(--fg2)}
  .fmt button[aria-pressed="true"]{color:var(--fg);font-weight:700}

  .go{margin-top:36px;height:40px;padding:0 22px;border-radius:999px;background:var(--fg);color:#000;
    font:600 13px var(--s);transition:transform .12s var(--ease),background-color .14s var(--ease)}
  .go:hover{background:#fff}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#b0b0b0" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="3" y="3" width="8" height="8"/></svg>
    <span>Filesmith</span>
    <div class="win">
      <button aria-label="Minimise"><svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor"><path d="M0 5.5h10"/></svg></button>
      <button aria-label="Maximise"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
      <button aria-label="Close"><svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </div>

  <main class="col">
    <h1 class="verbs" aria-label="Operations">
      <button aria-current="page">Convert</button>
      <button>Compress</button>
      <button>Resize</button>
      <button>Upscale</button>
      <button>Remove BG</button>
      <button>Generate</button>
      <button>Tools</button>
    </h1>
    <div class="rule" role="presentation"></div>

    <ul class="q">
      <li><span class="nm">IMG_4821.HEIC</span><span class="st">done</span></li>
      <li class="now"><span class="nm">screenshot.png</span><span class="st">62%</span></li>
      <li><span class="nm">hero-banner.png</span><span class="st">queued</span></li>
      <li class="bad"><span class="nm">scan_0091.tiff</span><span class="st">failed</span></li>
    </ul>

    <div class="fmt" role="group" aria-label="Target format">
      <button aria-pressed="true">WebP</button>
      <button aria-pressed="false">JPG</button>
      <button aria-pressed="false">PNG</button>
      <button aria-pressed="false">AVIF</button>
    </div>

    <button class="go">Convert 4 files</button>
  </main>
</div>
</body>
</html>
