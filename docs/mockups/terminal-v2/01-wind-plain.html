<!doctype html>
<!--
  Filesmith round 2, mockup 01: "Wind, plain"
  Wind's Settings shell with nothing extra added. A left rail, a title, four lines
  and one white pill. It looks like Wind's sibling app.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filesmith</title>
<style>
  :root {
    --bg: #000;
    --line: #151515;
    --fg: #f2f2f2;
    --fg2: #d0d0d0;
    --fg3: #8f8f8f;
    --glyph: #b0b0b0;
    --hover: #121212;
    --pill: #1d1d1d;
    --track: #303030;
    --s: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    --m: "Cascadia Mono", Consolas, monospace;
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  body {
    width: 1440px; height: 900px; overflow: hidden;
    color: var(--fg); font: 13px/1.4 var(--s);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* window chrome */
  .bar {
    height: 38px; display: flex; align-items: center;
    padding-left: 16px; -webkit-app-region: drag;
  }
  .mark { width: 14px; height: 14px; color: var(--glyph); }
  .app { margin-left: 10px; font-size: 12px; color: var(--fg3); }
  .win { margin-left: auto; display: flex; height: 100%; }
  .win button {
    width: 46px; height: 100%; display: grid; place-items: center;
    color: var(--fg3); transition: background-color .15s var(--ease), color .15s var(--ease);
  }
  .win button:hover { background: var(--hover); color: var(--fg); }
  .win svg { width: 10px; height: 10px; }

  .shell { display: flex; height: 862px; }

  /* rail */
  nav {
    width: 240px; flex: none; padding: 12px 10px;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 2px;
  }
  nav button {
    height: 36px; padding: 0 14px; border-radius: 8px; text-align: left;
    font: 500 12.5px/1 var(--m); color: var(--fg3);
    transition: background-color .15s var(--ease), color .15s var(--ease), transform .12s var(--ease);
  }
  nav button:hover { background: var(--hover); color: var(--fg2); }
  nav button[aria-current="page"] { background: var(--pill); color: var(--fg); }
  nav button:active { transform: scale(.97); }

  /* content */
  main { padding: 32px 40px; flex: 1; }
  h1 { font: 600 34px/1.15 var(--s); letter-spacing: -.01em; }

  .drop {
    display: block; margin-top: 28px; width: 560px; height: 36px; padding: 0 12px;
    margin-left: -12px; border-radius: 6px; text-align: left;
    font: 12.5px/36px var(--m); color: var(--fg3);
    transition: background-color .15s var(--ease), color .15s var(--ease);
  }
  .drop:hover { background: var(--hover); color: var(--fg2); }

  .queue { list-style: none; width: 560px; margin-top: 12px; }
  .queue li {
    height: 36px; display: flex; align-items: center; justify-content: space-between;
    font: 12.5px/1 var(--m); font-variant-numeric: tabular-nums;
  }
  .name { color: var(--fg2); }
  .st { color: var(--fg3); }
  .st.run { color: var(--fg); font-weight: 400; }
  .st.fail { color: var(--fg); font-weight: 700; }

  .opts { margin-top: 48px; display: grid; grid-template-columns: 96px auto; row-gap: 22px; align-items: center; }
  .label { color: var(--fg3); font-size: 13px; }

  .seg { display: flex; gap: 4px; }
  .seg button {
    height: 30px; padding: 0 14px; border-radius: 6px;
    font: 500 12.5px/1 var(--m); color: var(--fg3);
    transition: background-color .15s var(--ease), color .15s var(--ease), transform .12s var(--ease);
  }
  .seg button:hover { background: var(--hover); color: var(--fg2); }
  .seg button[aria-pressed="true"] { background: var(--pill); color: var(--fg); }
  .seg button:active { transform: scale(.97); }

  .slider { display: flex; align-items: center; gap: 16px; }
  .track { position: relative; width: 240px; height: 3px; background: var(--track); border-radius: 2px; }
  .fill { position: absolute; inset: 0 20% 0 0; background: var(--fg); border-radius: 2px; }
  .thumb {
    position: absolute; left: 80%; top: 50%; width: 12px; height: 12px;
    margin: -6px 0 0 -6px; border-radius: 50%; background: var(--fg);
  }
  .val { font: 12.5px/1 var(--m); color: var(--fg2); font-variant-numeric: tabular-nums; width: 24px; text-align: right; }

  .go {
    margin-top: 44px; height: 38px; padding: 0 22px; border-radius: 999px;
    background: #fff; color: #000; font: 600 13px/1 var(--s);
    transition: background-color .15s var(--ease), transform .12s var(--ease);
  }
  .go:hover { background: #d0d0d0; }
  .go:active { transform: scale(.97); }
</style>
</head>
<body>
  <header class="bar">
    <svg class="mark" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M2 2h10M2 7h7M2 2v10"/></svg>
    <span class="app">Filesmith</span>
    <div class="win">
      <button aria-label="Minimise"><svg viewBox="0 0 10 10" stroke="currentColor"><path d="M0 5.5h10"/></svg></button>
      <button aria-label="Maximise"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
      <button aria-label="Close"><svg viewBox="0 0 10 10" stroke="currentColor"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </header>

  <div class="shell">
    <nav aria-label="Operations">
      <button aria-current="page">Convert</button>
      <button>Compress</button>
      <button>Resize</button>
      <button>Upscale</button>
      <button>Remove BG</button>
      <button>Generate</button>
      <button>Tools</button>
    </nav>

    <main>
      <h1>Convert</h1>

      <button class="drop">+ drop files</button>

      <ul class="queue">
        <li><span class="name">IMG_4821.HEIC</span><span class="st">done</span></li>
        <li><span class="name">screenshot.png</span><span class="st run">62%</span></li>
        <li><span class="name">hero-banner.png</span><span class="st">queued</span></li>
        <li><span class="name">scan_0091.tiff</span><span class="st fail">✕ failed</span></li>
      </ul>

      <div class="opts">
        <span class="label">Format</span>
        <div class="seg" role="group" aria-label="Format">
          <button aria-pressed="true">WebP</button>
          <button aria-pressed="false">JPG</button>
          <button aria-pressed="false">PNG</button>
          <button aria-pressed="false">AVIF</button>
        </div>
        <span class="label">Quality</span>
        <div class="slider" role="slider" aria-label="Quality" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80" tabindex="0">
          <div class="track"><div class="fill"></div><div class="thumb"></div></div>
          <span class="val">80</span>
        </div>
      </div>

      <button class="go">Convert 4 files</button>
    </main>
  </div>
</body>
</html>
