<!doctype html>
<!--
  Filesmith round 2, mockup #16: Drop frame
  Pitch: The queue lives inside a large dashed region. The drop target and the list are the same object.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filesmith</title>
<style>
  :root {
    --bg: #000;
    --dash: #2a2a2a;
    --line: #151515;
    --fg: #f2f2f2;
    --fg2: #d0d0d0;
    --fg3: #8f8f8f;
    --glyph: #b0b0b0;
    --hover: #121212;
    --pill: #1d1d1d;
    --s: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    --m: "Cascadia Mono", Consolas, monospace;
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    width: 1440px; height: 900px; overflow: hidden;
    color: var(--fg); font: 13px/1.4 var(--s);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* title bar */
  .bar {
    height: 38px; display: flex; align-items: center;
    padding-left: 16px; gap: 10px;
    font: 12px var(--s); color: var(--fg3);
  }
  .bar svg.mark { width: 14px; height: 14px; }
  .win { margin-left: auto; display: flex; height: 100%; }
  .win button {
    width: 46px; height: 100%; display: grid; place-items: center;
    transition: background-color 150ms var(--ease);
  }
  .win button:hover { background: var(--hover); }
  .win svg { width: 10px; height: 10px; stroke: var(--glyph); fill: none; stroke-width: 1; }

  .app { display: flex; height: calc(900px - 38px); }

  /* rail */
  nav {
    width: 240px; padding: 12px 10px;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 2px;
  }
  nav button {
    height: 36px; padding: 0 14px; border-radius: 8px; text-align: left;
    font: 500 12.5px var(--m); color: var(--fg3);
    transition: background-color 150ms var(--ease), color 150ms var(--ease), transform 120ms var(--ease);
  }
  nav button:hover { background: var(--hover); color: var(--fg2); }
  nav button:active { transform: scale(.97); }
  nav button[aria-current="page"] { background: var(--pill); color: var(--fg); }

  /* content */
  main { flex: 1; padding: 32px 40px; }
  h1 {
    font: 600 34px/1.1 "Segoe UI Variable Display", var(--s);
    letter-spacing: -.01em; margin-bottom: 28px;
  }
  .col { width: 640px; }

  /* the drop frame: queue and drop target in one */
  .frame {
    height: 260px; border-radius: 10px;
    border: 1px dashed var(--dash);
    padding: 14px 12px 0;
    display: flex; flex-direction: column;
    transition: border-color 150ms var(--ease);
  }
  .frame:hover { border-color: #3a3a3a; }
  ul { list-style: none; }
  li {
    position: relative;
    height: 40px; padding: 0 12px; border-radius: 6px;
    display: flex; align-items: center; justify-content: space-between;
    font: 13px var(--m); color: var(--fg2);
    transition: background-color 150ms var(--ease);
  }
  li:hover { background: var(--hover); }
  .st { font-variant-numeric: tabular-nums; color: var(--fg3); }
  .st.run { color: var(--fg); }
  .st.fail { color: var(--fg); font-weight: 700; }
  li.failed .name { color: var(--fg); }
  .track {
    position: absolute; left: 12px; right: 12px; bottom: 2px; height: 1px;
    background: #1f1f1f;
  }
  .track i { display: block; height: 100%; width: 62%; background: var(--fg); }

  .drop {
    margin-top: auto; height: 52px;
    display: flex; align-items: center; justify-content: center;
    font: 13px var(--m); color: var(--fg3);
  }
  .drop button {
    color: var(--fg2); text-decoration: underline; text-underline-offset: 3px;
    text-decoration-color: #4a4a4a; border-radius: 4px;
    transition: color 150ms var(--ease);
  }
  .drop button:hover { color: var(--fg); }

  /* format + action */
  .act { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; }
  .seg { display: flex; gap: 2px; }
  .seg button {
    height: 32px; padding: 0 14px; border-radius: 999px;
    font: 500 12.5px var(--m); color: var(--fg3);
    transition: background-color 150ms var(--ease), color 150ms var(--ease), transform 120ms var(--ease);
  }
  .seg button:hover { background: var(--hover); color: var(--fg2); }
  .seg button:active { transform: scale(.97); }
  .seg button[aria-pressed="true"] { background: var(--pill); color: var(--fg); }
  .go {
    height: 36px; padding: 0 22px; border-radius: 999px;
    background: #fff; color: #000; font: 600 13px var(--s);
    transition: background-color 150ms var(--ease), transform 120ms var(--ease);
  }
  .go:hover { background: #e6e6e6; }
  .go:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="bar">
    <svg class="mark" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="1.5" width="11" height="11" fill="none" stroke="#b0b0b0" stroke-width="1.5"/><rect x="5" y="5" width="4" height="4" fill="#b0b0b0"/></svg>
    <span>Filesmith</span>
    <div class="win">
      <button aria-label="Minimise"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
      <button aria-label="Maximise"><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
      <button aria-label="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </div>

  <div class="app">
    <nav aria-label="Operations">
      <button aria-current="page">Convert</button>
      <button>Compress</button>
      <button>Resize</button>
      <button>Upscale</button>
      <button>Remove BG</button>
      <button>Generate</button>
      <button>Tools</button>
    </nav>

    <main>
      <h1>Convert</h1>
      <div class="col">
        <section class="frame" aria-label="Queue, drop files here">
          <ul>
            <li><span class="name">IMG_4821.HEIC</span><span class="st">done</span></li>
            <li><span class="name">screenshot.png</span><span class="st run">62%</span><span class="track"><i></i></span></li>
            <li><span class="name">hero-banner.png</span><span class="st">queued</span></li>
            <li class="failed"><span class="name">scan_0091.tiff</span><span class="st fail">failed</span></li>
          </ul>
          <div class="drop">drop files or&nbsp;<button>browse</button></div>
        </section>

        <div class="act">
          <div class="seg" role="group" aria-label="Target format">
            <button aria-pressed="true">WebP</button>
            <button aria-pressed="false">JPG</button>
            <button aria-pressed="false">PNG</button>
            <button aria-pressed="false">AVIF</button>
          </div>
          <button class="go">Convert 4 files</button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
