<!doctype html>
<!--
  Concept 13: Big verb
  Pitch: The verb is the hero. "Convert" is set at 88px light in the top-left,
  and everything else is small, quiet mono at 13px. Format and action sit just
  under the queue, so the lower half stays empty black.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Filesmith Big Verb</title>
<style>
  :root {
    --bg: #000000;
    --fg: #f2f2f2;
    --fg2: #d0d0d0;
    --fg3: #8f8f8f;
    --glyph: #b0b0b0;
    --hover: #121212;
    --sel: #1d1d1d;
    --s: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    --m: "Cascadia Mono", Consolas, monospace;
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    width: 1440px; height: 900px; overflow: hidden;
    color: var(--fg); font: 13px/1.4 var(--m);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: #f2f2f2; color: #000; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .app { display: grid; grid-template-rows: 38px 1fr; height: 900px; }

  /* title bar */
  .bar { display: flex; align-items: center; padding-left: 14px; -webkit-app-region: drag; }
  .brand { display: flex; align-items: center; gap: 9px; font: 12px var(--s); color: var(--fg3); }
  .brand svg { width: 14px; height: 14px; }
  .win { margin-left: auto; display: flex; height: 38px; }
  .win button { width: 46px; height: 38px; display: grid; place-items: center; color: var(--glyph);
    transition: background-color 140ms var(--ease), color 140ms var(--ease); }
  .win button:hover { background: var(--hover); color: var(--fg); }
  .win svg { width: 10px; height: 10px; }

  .body { display: grid; grid-template-columns: 240px 1fr; min-height: 0; }

  /* verb rail */
  nav { padding: 32px 10px 0 12px; display: flex; flex-direction: column; gap: 2px; }
  nav button {
    height: 36px; padding: 0 14px; border-radius: 8px; text-align: left;
    font: 400 13px var(--m); color: var(--fg3);
    transition: background-color 140ms var(--ease), color 140ms var(--ease), transform 120ms var(--ease);
  }
  nav button:hover { color: var(--fg2); background: var(--hover); }
  nav button[aria-current="page"] { color: var(--fg); }
  nav button[aria-current="page"]:hover { background: none; }
  nav button:active, .fmt button:active, .go:active { transform: scale(.97); }

  /* content */
  main { display: flex; flex-direction: column; padding: 40px 40px 56px 64px; min-height: 0; }
  h1 {
    font: 300 88px/1 var(--s); letter-spacing: -0.035em; color: var(--fg);
    margin-left: -5px; /* optical: pull the C onto the column edge */
  }
  .queue { list-style: none; margin-top: 48px; width: 420px; }
  .queue li { display: flex; justify-content: space-between; align-items: baseline; height: 32px; }
  .name { color: var(--fg2); }
  .st { font-variant-numeric: tabular-nums; color: var(--fg3); }
  .st.done { color: var(--fg2); }
  .st.run { color: var(--fg); }
  .st.fail { color: var(--fg); font-weight: 700; }

  .foot { margin-top: 48px; display: flex; flex-direction: column; align-items: flex-start; gap: 24px; }
  .fmt { display: flex; gap: 4px; margin-left: -12px; }
  .fmt button { height: 30px; padding: 0 12px; border-radius: 6px; color: var(--fg3);
    transition: background-color 140ms var(--ease), color 140ms var(--ease), transform 120ms var(--ease); }
  .fmt button:hover { color: var(--fg2); background: var(--hover); }
  .fmt button[aria-checked="true"] { color: var(--fg); background: var(--sel); }
  .go {
    height: 40px; padding: 0 22px; border-radius: 999px;
    background: #fff; color: #000; font: 600 13px var(--s);
    transition: background-color 140ms var(--ease), transform 120ms var(--ease);
  }
  .go:hover { background: #d0d0d0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 14 14" fill="none" stroke="#b0b0b0" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M2 2h10v3H5v2h5v3H5v2"/></svg>
      Filesmith
    </div>
    <div class="win">
      <button aria-label="Minimise"><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1"><path d="M0 5.5h10"/></svg></button>
      <button aria-label="Maximise"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
      <button aria-label="Close"><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </header>

  <div class="body">
    <nav aria-label="Operations">
      <button aria-current="page">Convert</button>
      <button>Compress</button>
      <button>Resize</button>
      <button>Upscale</button>
      <button>Remove BG</button>
      <button>Generate</button>
      <button>Tools</button>
    </nav>

    <main>
      <h1>Convert</h1>

      <ul class="queue" aria-label="Queue">
        <li><span class="name">IMG_4821.HEIC</span><span class="st done">done</span></li>
        <li><span class="name">screenshot.png</span><span class="st run">62%</span></li>
        <li><span class="name">hero-banner.png</span><span class="st">queued</span></li>
        <li><span class="name">scan_0091.tiff</span><span class="st fail">&#x2715; failed</span></li>
      </ul>

      <div class="foot">
        <div class="fmt" role="radiogroup" aria-label="Target format">
          <button role="radio" aria-checked="true">WebP</button>
          <button role="radio" aria-checked="false">JPG</button>
          <button role="radio" aria-checked="false">PNG</button>
          <button role="radio" aria-checked="false">AVIF</button>
        </div>
        <button class="go">Convert 4 files</button>
      </div>
    </main>
  </div>
</div>
</body>
</html>
