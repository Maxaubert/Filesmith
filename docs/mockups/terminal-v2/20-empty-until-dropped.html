<!doctype html>
<!--
  Filesmith terminal v2, mockup 20: Nothing until dropped
  Pitch: the resting screen is almost blank, the verb list and one centred line "+ drop files".
  The queue, the format choice and the button appear only once files arrive.
  Default view is the resting state. Open with #loaded (or click the drop line) to see files in the queue.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Filesmith</title>
<style>
  :root{
    --bg:#000; --fg:#f2f2f2; --fg2:#d0d0d0; --fg3:#8f8f8f; --glyph:#b0b0b0;
    --hover:#121212; --sel:#1d1d1d;
    --m:"Cascadia Mono", Consolas, ui-monospace, monospace;
    --s:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg)}
  body{width:1440px;height:900px;overflow:hidden;font:13px/1.4 var(--m);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid #f2f2f2;outline-offset:2px}

  /* title bar */
  .bar{height:38px;display:flex;align-items:center;padding-left:16px;font:12px var(--s);color:var(--fg3)}
  .bar svg{margin-right:10px}
  .win{margin-left:auto;display:flex;height:100%}
  .win button{width:46px;height:100%;display:grid;place-items:center;color:var(--glyph);transition:background-color .15s var(--ease)}
  .win button:hover{background:var(--hover)}

  .app{display:flex;height:862px}

  /* verb rail */
  nav{width:240px;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
  nav button{height:36px;padding:0 14px;border-radius:8px;text-align:left;font-weight:500;font-size:12.5px;color:var(--fg3);transition:background-color .15s var(--ease),color .15s var(--ease)}
  nav button:hover{background:var(--hover);color:var(--fg2)}
  nav button[aria-current]{background:var(--sel);color:var(--fg)}
  nav button:active,.fmt button:active,.go:active,.drop:active{transform:scale(.97)}

  /* content: one centred column */
  main{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding-bottom:38px}
  .col{width:520px}

  .drop{display:block;width:100%;height:40px;padding:0 12px;border-radius:6px;text-align:left;color:var(--fg3);transition:background-color .15s var(--ease),color .15s var(--ease)}
  .drop:hover{background:var(--hover);color:var(--fg2)}
  .drop b{font-weight:400;color:var(--glyph);margin-right:10px}

  ol{list-style:none}
  li{position:relative;height:40px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;color:var(--fg2)}
  li .st{font-variant-numeric:tabular-nums;color:var(--fg2)}
  li.q, li.q .st{color:var(--fg3)}
  li.f, li.f .st{color:var(--fg);font-weight:700}

  .act{margin-top:40px;display:flex;align-items:center;justify-content:space-between}
  .fmt{display:flex;gap:2px}
  .fmt button{height:30px;padding:0 12px;border-radius:999px;color:var(--fg3);transition:background-color .15s var(--ease),color .15s var(--ease)}
  .fmt button:hover{color:var(--fg2);background:var(--hover)}
  .fmt button[aria-pressed=true]{background:var(--sel);color:var(--fg)}
  .go{height:36px;padding:0 20px;border-radius:999px;background:var(--fg);color:#000;font-weight:600;transition:background-color .15s var(--ease)}
  .go:hover{background:#fff}

  /* progressive disclosure */
  .loaded{transition:opacity .18s var(--ease)}
  body.empty .loaded{display:none}
  body.empty .drop{text-align:center}
</style>
</head>
<body class="empty">
  <header class="bar">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#b0b0b0" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M2 2h10v10H2z M5 7h4"/></svg>
    Filesmith
    <div class="win">
      <button aria-label="Minimise"><svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor"><path d="M0 5.5h10"/></svg></button>
      <button aria-label="Maximise"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><path d="M.5 .5h9v9h-9z"/></svg></button>
      <button aria-label="Close"><svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </header>

  <div class="app">
    <nav aria-label="Operations">
      <button aria-current="page">Convert</button>
      <button>Compress</button>
      <button>Resize</button>
      <button>Upscale</button>
      <button>Remove BG</button>
      <button>Generate</button>
      <button>Tools</button>
    </nav>

    <main>
      <div class="col">
        <ol class="loaded" aria-label="Queue">
          <li><span>IMG_4821.HEIC</span><span class="st">done</span></li>
          <li class="p"><span>screenshot.png</span><span class="st">62%</span></li>
          <li class="q"><span>hero-banner.png</span><span class="st">queued</span></li>
          <li class="f"><span>scan_0091.tiff</span><span class="st">failed</span></li>
        </ol>

        <button class="drop" id="drop"><b>+</b>drop files</button>

        <div class="act loaded">
          <div class="fmt" role="group" aria-label="Format">
            <button aria-pressed="true">WebP</button>
            <button aria-pressed="false">JPG</button>
            <button aria-pressed="false">PNG</button>
            <button aria-pressed="false">AVIF</button>
          </div>
          <button class="go">Convert 4 files</button>
        </div>
      </div>
    </main>
  </div>

<script>
  document.body.classList.toggle('empty', location.hash !== '#loaded');
  document.getElementById('drop').onclick = () => document.body.classList.toggle('empty');
  document.querySelectorAll('.fmt button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.fmt button').forEach(x => x.setAttribute('aria-pressed', x === b));
  });
</script>
</body>
</html>
