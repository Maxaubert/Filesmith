<!--
  Filesmith round 2, mockup 04: Wind, icon rail
  Pitch: the closest to a shipping desktop app. A Wind rail with small 1.5px grey
  line icons beside each verb, and the content kept very sparse. Icons live only
  in the rail; the queue rows double as the drop target.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filesmith, icon rail</title>
<style>
  :root{
    --bg:#000; --line:#151515; --hover:#121212;
    --fg:#f2f2f2; --fg2:#d0d0d0; --fg3:#8f8f8f; --icon:#b0b0b0;
    --pill:#262626; --track:#303030;
    --s:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
    --m:"Cascadia Mono",Consolas,monospace;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000}
  body{width:1440px;height:900px;overflow:hidden;color:var(--fg);font:13px/1.4 var(--s);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid #f2f2f2;outline-offset:2px}

  .app{display:grid;grid-template-rows:38px 1fr;height:900px}

  /* title bar */
  .bar{display:flex;align-items:center;-webkit-app-region:drag}
  .brand{display:flex;align-items:center;gap:10px;padding-left:16px;font-size:12px;color:var(--fg3)}
  .mark{width:14px;height:14px;border:1.5px solid var(--icon);border-radius:3px;position:relative}
  .mark::after{content:"";position:absolute;left:2px;right:2px;top:4px;height:1.5px;background:var(--icon);box-shadow:0 3px 0 var(--icon)}
  .win{margin-left:auto;display:flex;height:38px}
  .win button{width:46px;height:38px;display:grid;place-items:center;color:var(--fg3);transition:background-color .15s var(--ease),color .15s var(--ease)}
  .win button:hover{background:var(--hover);color:var(--fg)}
  .win svg{width:10px;height:10px;stroke:currentColor;stroke-width:1;fill:none}

  .body{display:grid;grid-template-columns:220px 1fr;min-height:0}

  /* rail */
  .rail{border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px}
  .nav{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:8px;
       font:500 12.5px/1 var(--m);color:var(--fg3);text-align:left;width:100%;
       transition:background-color .15s var(--ease),color .15s var(--ease)}
  .nav svg{width:16px;height:16px;flex:none;stroke:var(--icon);stroke-width:1.5;fill:none;stroke-linecap:square;stroke-linejoin:miter;opacity:.8;transition:opacity .15s var(--ease)}
  .nav:hover{background:var(--hover);color:var(--fg2)}
  .nav:hover svg{opacity:1}
  .nav:active{transform:scale(.97)}
  .nav[aria-current="page"]{background:var(--pill);color:var(--fg)}
  .nav[aria-current="page"] svg{stroke:var(--fg);opacity:1}

  /* content */
  .main{padding:32px 40px 0}
  h1{font:600 34px/1.15 "Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;letter-spacing:-.01em;color:var(--fg)}

  .work{display:grid;grid-template-columns:480px 240px;column-gap:80px;margin-top:48px;align-items:start}

  .queue{list-style:none}
  .row{position:relative;display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 14px;margin:0 -14px;border-radius:8px;
       font:13px/1 var(--m);transition:background-color .15s var(--ease)}
  .row:hover{background:var(--hover)}
  .row .n{color:var(--fg2)}
  .row .st{font-variant-numeric:tabular-nums;text-align:right;color:var(--fg3)}
  .row.done .st{color:var(--fg3)}
  .row.run .n{color:var(--fg2)}
  .row.run .st{color:var(--fg)}
  .row.run::after{content:"";position:absolute;left:14px;bottom:8px;height:1px;width:calc((100% - 28px) * .62);background:var(--fg)}
  .row.run::before{content:"";position:absolute;left:14px;right:14px;bottom:8px;height:1px;background:#262626}
  .row.wait .n{color:var(--fg3)}
  .row.fail .n{color:var(--fg)}
  .row.fail .st{color:var(--fg);font-weight:700}

  .side{display:flex;flex-direction:column}
  .cap{font-size:13px;color:var(--fg3);margin-bottom:10px;display:flex;justify-content:space-between}
  .cap b{font:400 13px/1.4 var(--m);color:var(--fg2);font-variant-numeric:tabular-nums}

  .seg{display:flex;gap:2px}
  .seg button{flex:1;height:32px;border-radius:6px;font:500 12.5px/1 var(--m);color:var(--fg3);
              transition:background-color .15s var(--ease),color .15s var(--ease)}
  .seg button:hover{background:var(--hover);color:var(--fg2)}
  .seg button:active{transform:scale(.97)}
  .seg button[aria-pressed="true"]{background:var(--pill);color:var(--fg)}

  .q{margin-top:36px}
  .slider{position:relative;height:16px;display:flex;align-items:center}
  .slider .t{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:var(--track)}
  .slider .f{position:absolute;left:0;width:80%;height:3px;border-radius:2px;background:var(--fg)}
  .slider .k{position:absolute;left:calc(80% - 6px);width:12px;height:12px;border-radius:50%;background:var(--fg)}

  .go{margin-top:44px;align-self:flex-start;height:38px;padding:0 22px;border-radius:999px;background:#fff;color:#000;
      font:600 13px/1 var(--s);transition:opacity .15s var(--ease)}
  .go:hover{opacity:.88}
  .go:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="mark" aria-hidden="true"></span>Filesmith</div>
    <div class="win">
      <button aria-label="Minimise"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
      <button aria-label="Maximise"><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
      <button aria-label="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </header>

  <div class="body">
    <nav class="rail" aria-label="Operations">
      <button class="nav" aria-current="page"><svg viewBox="0 0 16 16"><path d="M2 5h11M10 2l3 3-3 3M14 11H3M6 8l-3 3 3 3"/></svg>Convert</button>
      <button class="nav"><svg viewBox="0 0 16 16"><path d="M8 1v5M5 3.5L8 6l3-2.5M8 15v-5M5 12.5L8 10l3 2.5M2 8h12"/></svg>Compress</button>
      <button class="nav"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M14 10v4h-4M2 2l5 5M14 14l-5-5"/></svg>Resize</button>
      <button class="nav"><svg viewBox="0 0 16 16"><path d="M2 14V7h7v7zM9 7l5-5M9 2h5v5"/></svg>Upscale</button>
      <button class="nav"><svg viewBox="0 0 16 16"><path d="M2 2h3M7 2h2M11 2h3v3M14 7v2M14 11v3h-3M9 14H7M5 14H2v-3M2 9V7M2 5V2"/><circle cx="8" cy="8" r="2.5"/></svg>Remove BG</button>
      <button class="nav"><svg viewBox="0 0 16 16"><path d="M8 1.5v4M8 10.5v4M1.5 8h4M10.5 8h4"/></svg>Generate</button>
      <button class="nav"><svg viewBox="0 0 16 16"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/></svg>Tools</button>
    </nav>

    <main class="main">
      <h1>Convert</h1>

      <div class="work">
        <ul class="queue" aria-label="Queue, drop files here">
          <li class="row done"><span class="n">IMG_4821.HEIC</span><span class="st">done</span></li>
          <li class="row run"><span class="n">screenshot.png</span><span class="st">62%</span></li>
          <li class="row wait"><span class="n">hero-banner.png</span><span class="st">queued</span></li>
          <li class="row fail"><span class="n">scan_0091.tiff</span><span class="st">&#x2715; failed</span></li>
        </ul>

        <div class="side">
          <div class="cap">Format</div>
          <div class="seg" role="group" aria-label="Format">
            <button aria-pressed="true">WebP</button>
            <button aria-pressed="false">JPG</button>
            <button aria-pressed="false">PNG</button>
            <button aria-pressed="false">AVIF</button>
          </div>

          <div class="q">
            <div class="cap">Quality <b>80</b></div>
            <div class="slider" role="slider" aria-label="Quality" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80" tabindex="0">
              <span class="t"></span><span class="f"></span><span class="k"></span>
            </div>
          </div>

          <button class="go">Convert 4 files</button>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
