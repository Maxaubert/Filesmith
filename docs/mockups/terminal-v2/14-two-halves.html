<!doctype html>
<!--
  Filesmith terminal v2, mockup 14: Two halves
  Pitch: Files on the left half and the decision on the right. Each half has one job,
  separated by black space only.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filesmith</title>
<style>
  :root {
    --bg:#000; --fg:#f2f2f2; --fg2:#d0d0d0; --fg3:#8f8f8f; --glyph:#b0b0b0;
    --hover:#121212; --pill:#1d1d1d;
    --s:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
    --m:"Cascadia Mono",Consolas,monospace;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#000; }
  body { width:1440px; height:900px; overflow:hidden; color:var(--fg);
    font:13px/1.4 var(--m); -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  button:focus-visible { outline:2px solid #f2f2f2; outline-offset:2px; }

  /* title bar */
  .bar { height:38px; display:flex; align-items:center; padding-left:16px; }
  .bar .mark { width:14px; height:14px; color:var(--glyph); }
  .bar .name { font:500 12px var(--s); color:var(--fg3); margin-left:10px; }
  .bar .win { margin-left:auto; display:flex; height:100%; }
  .bar .win span { width:46px; display:grid; place-items:center; color:var(--glyph); }
  .bar .win svg { width:10px; height:10px; }

  /* verbs: plain words, top left, no pill */
  nav { position:absolute; left:108px; top:76px; display:flex; gap:4px; }
  nav button { font:500 12.5px var(--m); color:var(--fg3); padding:8px 12px; border-radius:8px;
    transition:color .15s var(--ease), background-color .15s var(--ease); }
  nav button:hover { color:var(--fg2); background:var(--hover); }
  nav button[aria-current] { color:var(--fg); font-weight:700; }
  nav button:active, .row:active, .fmt button:active, .go:active, .drop:active { transform:scale(.97); }

  /* two true halves: left 120-600, gutter 240, right 840-1320 */
  .left  { position:absolute; left:120px; top:380px; width:480px; }
  .right { position:absolute; left:840px; top:200px; width:240px; }
  ul { list-style:none; }
  .row { height:48px; display:flex; align-items:center; justify-content:space-between;
    padding:0 12px; margin:0 -12px; border-radius:6px; transition:background-color .15s var(--ease); }
  .row:hover { background:var(--hover); }
  .row .n { color:var(--fg2); }
  .st { font-variant-numeric:tabular-nums; }
  .st.done, .st.wait { color:var(--fg3); }
  .st.run { color:var(--fg); }
  .row.bad .n { color:var(--fg); }
  .st.fail { color:var(--fg); font-weight:700; }
  .drop { margin-top:20px; height:40px; display:flex; align-items:center; color:var(--fg3);
    padding:0 12px; margin-left:-12px; border-radius:6px; transition:color .15s var(--ease), background-color .15s var(--ease); }
  .drop:hover { color:var(--fg2); background:var(--hover); }

  .fmt button { width:100%; height:34px; display:flex; align-items:center; text-align:left;
    color:var(--fg3); padding:0 12px 0 0; border-radius:6px;
    transition:color .15s var(--ease), background-color .15s var(--ease); }
  .fmt button::before { content:"›"; width:24px; text-align:center; opacity:0; }
  .fmt button:hover { color:var(--fg2); background:var(--hover); }
  .fmt button[aria-pressed="true"] { color:var(--fg); }
  .fmt button[aria-pressed="true"]::before { opacity:1; }
  .go { margin-top:28px; margin-left:24px; height:40px; padding:0 22px; border-radius:999px; background:#fff; color:#000;
    font:600 13px var(--s); transition:background-color .15s var(--ease); }
  .go:hover { background:#d0d0d0; }
</style>
</head>
<body>
  <header class="bar">
    <svg class="mark" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2 2h10v10H2z M5 5h4"/></svg>
    <span class="name">Filesmith</span>
    <div class="win" aria-hidden="true">
      <span><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1"><path d="M0 5.5h10"/></svg></span>
      <span><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><path d="M.5.5h9v9h-9z"/></svg></span>
      <span><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1"><path d="M0 0l10 10M10 0L0 10"/></svg></span>
    </div>
  </header>

  <nav aria-label="Operations">
    <button aria-current="page">Convert</button>
    <button>Compress</button>
    <button>Resize</button>
    <button>Upscale</button>
    <button>Remove BG</button>
    <button>Generate</button>
    <button>Tools</button>
  </nav>

  <main>
    <section class="left" aria-label="Files">
      <ul>
        <li class="row"><span class="n">IMG_4821.HEIC</span><span class="st done">done</span></li>
        <li class="row"><span class="n">screenshot.png</span><span class="st run">62%</span></li>
        <li class="row"><span class="n">hero-banner.png</span><span class="st wait">queued</span></li>
        <li class="row bad"><span class="n">scan_0091.tiff</span><span class="st fail">failed</span></li>
      </ul>
      <button class="drop">+ drop files</button>
    </section>

    <section class="right" aria-label="Target format">
      <div class="fmt">
        <button aria-pressed="true">WebP</button>
        <button aria-pressed="false">JPG</button>
        <button aria-pressed="false">PNG</button>
        <button aria-pressed="false">AVIF</button>
      </div>
      <button class="go">Convert 4 files</button>
    </section>
  </main>
</body>
</html>
