<!doctype html>
<!--
  Filesmith round 2, mockup 15: Key and value
  Pitch: everything is a two-column mono list. Files with their statuses and settings
  with their values all snap to one shared value column, and the action sits on it too.
  The whole window is the drop target (hover state only, no drop line).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filesmith</title>
<style>
  :root {
    --bg: #000;
    --fg: #f2f2f2;
    --fg2: #d0d0d0;
    --fg3: #8f8f8f;
    --glyph: #b0b0b0;
    --line: #151515;
    --hover: #121212;
    --pill: #1d1d1d;
    --s: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    --m: "Cascadia Mono", Consolas, monospace;
    --ease: cubic-bezier(.2,.7,.2,1);
    --val: 360px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    width: 1440px; height: 900px; overflow: hidden;
    color: var(--fg); font: 13px/1.4 var(--m);
    display: grid; grid-template-rows: 38px 1fr;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* title bar */
  .bar { display: flex; align-items: center; padding-left: 14px; user-select: none; }
  .bar .mark { width: 14px; height: 14px; color: var(--glyph); }
  .bar .name { margin-left: 10px; font: 12px var(--s); color: var(--fg3); }
  .bar .win { margin-left: auto; display: flex; height: 100%; }
  .bar .win button { width: 46px; height: 100%; display: grid; place-items: center; color: var(--glyph);
    transition: background-color 150ms var(--ease), color 150ms var(--ease); }
  .bar .win button:hover { background: var(--hover); color: var(--fg); }
  .bar .win svg { width: 10px; height: 10px; }

  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 0; }

  /* rail */
  .rail { border-right: 1px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  .rail button {
    height: 36px; padding: 0 14px; border-radius: 8px; text-align: left;
    font: 500 12.5px var(--m); color: var(--fg3);
    transition: background-color 150ms var(--ease), color 150ms var(--ease), transform 120ms var(--ease);
  }
  .rail button:hover { background: var(--hover); color: var(--fg2); }
  .rail button[aria-current="page"] { background: var(--pill); color: var(--fg); }
  .rail button:active { transform: scale(.97); }

  /* content */
  main { padding: 32px 40px; position: relative; }
  h1 { font: 600 34px/1.15 var(--s); letter-spacing: -.01em; color: var(--fg); margin-bottom: 44px; }

  .kv { display: grid; grid-template-columns: var(--val) auto; align-items: center; }
  .kv > * { height: 36px; display: flex; align-items: center; }
  .k { color: var(--fg2); }
  .v { color: var(--fg3); font-variant-numeric: tabular-nums; }
  .v.done { color: var(--fg2); }
  .v.live { color: var(--fg); }
  .v.fail { color: var(--fg); font-weight: 700; }
  .gap { grid-column: 1 / -1; height: 36px; }
  .k.opt { color: var(--fg3); }

  .fmt { gap: 4px; margin-left: -10px; }
  .fmt button, .q {
    height: 28px; padding: 0 10px; border-radius: 6px; color: var(--fg3);
    transition: background-color 150ms var(--ease), color 150ms var(--ease), transform 120ms var(--ease);
  }
  .fmt button:hover, .q:hover { background: var(--hover); color: var(--fg2); }
  .fmt button[aria-pressed="true"] { background: var(--pill); color: var(--fg); }
  .fmt button:active, .q:active { transform: scale(.97); }
  .q { margin-left: -10px; color: var(--fg2); font-variant-numeric: tabular-nums; }

  .act { grid-column: 2; height: auto !important; margin-top: 36px; }
  .go {
    height: 36px; padding: 0 20px; border-radius: 999px;
    background: #fff; color: #000; font: 600 13px var(--s);
    transition: background-color 150ms var(--ease), transform 120ms var(--ease);
  }
  .go:hover { background: #d0d0d0; }
  .go:active { transform: scale(.97); }

  /* whole window is the drop target: only visible while dragging */
  body.dragging main::after {
    content: ""; position: absolute; inset: 16px; border: 1px dashed #4a4a4a; border-radius: 12px; pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header class="bar">
    <svg class="mark" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M2 12V2h10M2 7h7"/></svg>
    <span class="name">Filesmith</span>
    <div class="win">
      <button aria-label="Minimise"><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1"><path d="M0 5.5h10"/></svg></button>
      <button aria-label="Maximise"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
      <button aria-label="Close"><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </header>

  <div class="app">
    <nav class="rail" aria-label="Operations">
      <button aria-current="page">Convert</button>
      <button>Compress</button>
      <button>Resize</button>
      <button>Upscale</button>
      <button>Remove BG</button>
      <button>Generate</button>
      <button>Tools</button>
    </nav>

    <main>
      <h1>Convert</h1>

      <div class="kv">
        <span class="k">IMG_4821.HEIC</span>   <span class="v done">done</span>
        <span class="k">screenshot.png</span>  <span class="v live">62%</span>
        <span class="k">hero-banner.png</span> <span class="v">queued</span>
        <span class="k">scan_0091.tiff</span> <span class="v fail">failed</span>

        <span class="gap"></span>

        <span class="k opt">format</span>
        <div class="fmt" role="group" aria-label="Format">
          <button aria-pressed="true">webp</button>
          <button aria-pressed="false">jpg</button>
          <button aria-pressed="false">png</button>
          <button aria-pressed="false">avif</button>
        </div>
        <span class="k opt">quality</span>
        <div><button class="q" aria-label="Quality 80">80</button></div>

        <div class="act"><button class="go">Convert 4 files</button></div>
      </div>
    </main>
  </div>
<script>
  let n = 0;
  addEventListener('dragenter', e => { e.preventDefault(); n++; document.body.classList.add('dragging'); });
  addEventListener('dragleave', () => { if (--n <= 0) { n = 0; document.body.classList.remove('dragging'); } });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); n = 0; document.body.classList.remove('dragging'); });
  document.querySelectorAll('.fmt button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.fmt button').forEach(x => x.setAttribute('aria-pressed', x === b));
  }));
</script>
</body>
</html>
