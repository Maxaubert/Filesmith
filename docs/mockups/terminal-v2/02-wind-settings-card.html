<!doctype html>
<!--
  Filesmith round 2, mockup 02: Wind, settings card
  Pitch: the queue and the options sit in Wind-style cards, so the convert page reads like a settings page.
  Format is a settings row with a value and a chevron, so no format strip shows on screen.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Filesmith</title>
<style>
  :root {
    --bg: #000000;
    --line: #151515;
    --rowline: #0f0f0f;
    --card: #080808;
    --cardline: #0e0e0e;
    --hover: #121212;
    --pill: #1d1d1d;
    --fg: #f2f2f2;
    --fg2: #d0d0d0;
    --fg3: #8f8f8f;
    --glyph: #b0b0b0;
    --track: #303030;
    --accent: #ffffff;
    --onaccent: #000000;
    --s: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    --sd: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    --m: "Cascadia Mono", Consolas, monospace;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    width: 1440px; height: 900px; overflow: hidden;
    color: var(--fg); font: 13px/1.4 var(--s);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* window chrome */
  .chrome {
    height: 38px; display: flex; align-items: center;
    padding-left: 16px; -webkit-app-region: drag;
  }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--fg3); font-size: 12px; }
  .brand svg { display: block; }
  .win { margin-left: auto; display: flex; height: 100%; -webkit-app-region: no-drag; }
  .win button {
    width: 46px; height: 100%; display: grid; place-items: center; color: var(--glyph);
    transition: background-color 150ms var(--ease), color 150ms var(--ease);
  }
  .win button:hover { background: var(--hover); color: var(--fg); }

  .app { display: flex; height: calc(900px - 38px); }

  /* verb rail */
  .rail {
    width: 240px; flex: none; padding: 12px 10px;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 2px;
  }
  .rail button {
    height: 36px; padding: 0 14px; border-radius: 8px; text-align: left;
    font: 500 12.5px/1 var(--m); color: var(--fg3);
    transition: background-color 150ms var(--ease), color 150ms var(--ease), transform 120ms var(--ease);
  }
  .rail button:hover { background: var(--hover); color: var(--fg2); }
  .rail button:active { transform: scale(.97); }
  .rail button[aria-current="page"] { background: var(--pill); color: var(--fg); }

  /* content */
  main { flex: 1; padding: 32px 40px 0 64px; }
  .col { width: 640px; }
  h1 {
    font: 600 34px/1.1 var(--sd); letter-spacing: -0.01em;
    color: var(--fg); margin-bottom: 28px;
  }

  .card {
    background: var(--card); border: 1px solid var(--cardline);
    border-radius: 12px; overflow: hidden;
  }
  .card + .card { margin-top: 16px; }

  /* queue card */
  .file {
    position: relative; height: 52px; padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--rowline);
    font-family: var(--m); font-size: 13px;
  }
  .file:first-child { border-top: 0; }
  .name { color: var(--fg2); }
  .st { color: var(--fg2); font-variant-numeric: tabular-nums; }
  .st.dim { color: var(--fg3); }
  .file.failed .name { color: var(--fg); font-weight: 700; }
  .st.fail { color: var(--fg); font-weight: 700; }
  .bar {
    position: absolute; left: 0; bottom: 0; z-index: 1; height: 1px; width: 62%;
    background: var(--fg);
  }
  .drop {
    width: 100%; height: 52px; padding: 0 20px; text-align: left;
    border-top: 1px solid var(--rowline);
    font-family: var(--m); color: var(--fg3);
    transition: background-color 150ms var(--ease), color 150ms var(--ease);
  }
  .drop:hover { background: var(--hover); color: var(--fg2); }
  .drop:active { transform: scale(.995); }

  /* options card */
  .row {
    height: 62px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--rowline);
  }
  .row:first-child { border-top: 0; }
  .label { color: var(--fg3); font-size: 13px; }
  .fmt { position: relative; }
  .val {
    height: 32px; padding: 0 10px 0 12px; border-radius: 6px;
    display: flex; align-items: center; gap: 10px;
    font: 13px/1 var(--m); color: var(--fg2);
    transition: background-color 150ms var(--ease), color 150ms var(--ease), transform 120ms var(--ease);
  }
  .val:hover { background: var(--hover); color: var(--fg); }
  .val:active { transform: scale(.97); }
  .val .chev { color: var(--glyph); }
  .list {
    position: absolute; right: 0; top: 38px; z-index: 2; width: 132px; padding: 4px;
    background: #0e0e0e; border: 1px solid #212121; border-radius: 8px;
    display: none;
  }
  .fmt.open .list { display: block; }
  .list button {
    width: 100%; height: 30px; padding: 0 10px; border-radius: 5px; text-align: left;
    font: 13px/1 var(--m); color: var(--fg3);
  }
  .list button:hover { background: var(--hover); color: var(--fg2); }
  .list button[aria-selected="true"] { color: var(--fg); }

  .slider { display: flex; align-items: center; gap: 16px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 200px; height: 12px; background: transparent;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px;
    background: linear-gradient(var(--fg), var(--fg)) 0 0 / var(--p, 80%) 100% no-repeat, var(--track);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: var(--fg); margin-top: -4.5px;
  }
  .num { width: 24px; text-align: right; font: 13px/1 var(--m); color: var(--fg2); font-variant-numeric: tabular-nums; }

  .actions { display: flex; justify-content: flex-end; margin-top: 24px; }
  .go {
    height: 36px; padding: 0 20px; border-radius: 999px;
    background: var(--accent); color: var(--onaccent);
    font: 600 13px/1 var(--s);
    transition: background-color 150ms var(--ease), transform 120ms var(--ease);
  }
  .go:hover { background: #e6e6e6; }
  .go:active { transform: scale(.97); }
</style>
</head>
<body>
  <header class="chrome">
    <div class="brand">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <rect x="1.75" y="1.75" width="10.5" height="10.5" stroke="#b0b0b0" stroke-width="1.5"/>
        <path d="M4.5 9.5h5" stroke="#b0b0b0" stroke-width="1.5" stroke-linecap="square"/>
      </svg>
      Filesmith
    </div>
    <div class="win">
      <button aria-label="Minimise"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10" stroke="currentColor"/></svg></button>
      <button aria-label="Maximise"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
      <button aria-label="Close"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M.5.5l9 9M9.5.5l-9 9" stroke="currentColor"/></svg></button>
    </div>
  </header>

  <div class="app">
    <nav class="rail" aria-label="Operations">
      <button aria-current="page">Convert</button>
      <button>Compress</button>
      <button>Resize</button>
      <button>Upscale</button>
      <button>Remove BG</button>
      <button>Generate</button>
      <button>Tools</button>
    </nav>

    <main>
      <div class="col">
        <h1>Convert</h1>

        <section class="card" aria-label="Files">
          <div class="file"><span class="name">IMG_4821.HEIC</span><span class="st">done</span></div>
          <div class="file"><span class="name">screenshot.png</span><span class="st">62%</span><span class="bar" aria-hidden="true"></span></div>
          <div class="file"><span class="name">hero-banner.png</span><span class="st dim">queued</span></div>
          <div class="file failed"><span class="name">scan_0091.tiff</span><span class="st fail">&#x2715; failed</span></div>
          <button class="drop">+ drop files or browse</button>
        </section>

        <section class="card" aria-label="Options">
          <div class="row">
            <span class="label">Format</span>
            <div class="fmt" id="fmt">
              <button class="val" aria-haspopup="listbox" aria-expanded="false" id="fmtBtn"><span id="fmtVal">WebP</span><span class="chev" aria-hidden="true">›</span></button>
              <div class="list" role="listbox" aria-label="Format">
                <button role="option" aria-selected="true">WebP</button>
                <button role="option" aria-selected="false">JPG</button>
                <button role="option" aria-selected="false">PNG</button>
                <button role="option" aria-selected="false">AVIF</button>
              </div>
            </div>
          </div>
          <div class="row">
            <label class="label" for="q">Quality</label>
            <div class="slider">
              <input id="q" style="--p:80%" type="range" min="0" max="100" value="80">
              <span class="num" id="qv">80</span>
            </div>
          </div>
        </section>

        <div class="actions"><button class="go">Convert 4 files</button></div>
      </div>
    </main>
  </div>

<script>
  const fmt = document.getElementById('fmt'), btn = document.getElementById('fmtBtn');
  btn.onclick = () => { const o = fmt.classList.toggle('open'); btn.setAttribute('aria-expanded', o); };
  fmt.querySelectorAll('[role=option]').forEach(b => b.onclick = () => {
    fmt.querySelectorAll('[role=option]').forEach(x => x.setAttribute('aria-selected', x === b));
    document.getElementById('fmtVal').textContent = b.textContent;
    fmt.classList.remove('open'); btn.setAttribute('aria-expanded', false);
  });
  const q = document.getElementById('q');
  q.oninput = () => { document.getElementById('qv').textContent = q.value;
    q.style.setProperty('--p', q.value + '%'); };
</script>
</body>
</html>
