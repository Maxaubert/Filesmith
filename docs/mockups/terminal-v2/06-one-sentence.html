<!doctype html>
<!--
  Filesmith terminal v2, mockup 06: One sentence
  Pitch: the options and the action read as one line, "convert 4 files to webp at 80   run".
  The dotted-underlined words are the controls; "run" sits on the same baseline.
  Lowercase verb row left-aligned to the column, no pill. The whole window is the drop target.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440, initial-scale=1">
<title>Filesmith One Sentence</title>
<style>
  :root {
    --bg: #000000;
    --fg: #f2f2f2;
    --fg2: #d0d0d0;
    --fg3: #8f8f8f;
    --glyph: #b0b0b0;
    --under: #5a5a5a;
    --hover: #121212;
    --pop: #080808;
    --popline: #1b1b1b;
    --m: "Cascadia Mono", Consolas, monospace;
    --s: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    width: 1440px; height: 900px; overflow: hidden;
    color: var(--fg); font: 13px/1.4 var(--m);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* title bar */
  .bar { height: 38px; display: flex; align-items: center; padding-left: 14px; -webkit-app-region: drag; }
  .brand { display: flex; align-items: center; gap: 9px; font: 12px var(--s); color: var(--fg3); }
  .brand svg { width: 14px; height: 14px; }
  .win { margin-left: auto; display: flex; height: 100%; }
  .win button { width: 46px; height: 38px; display: grid; place-items: center; color: var(--glyph);
    transition: background-color 140ms var(--ease), color 140ms var(--ease); }
  .win button:hover { background: var(--hover); color: var(--fg); }
  .win svg { width: 10px; height: 10px; }

  /* one column, one axis */
  .col { width: 560px; margin: 0 auto; }

  nav { margin-top: 30px; display: flex; gap: 26px; }
  nav a {
    font-size: 12.5px; font-weight: 500; color: var(--fg3); text-decoration: none;
    padding: 4px 0; border-radius: 4px; display: inline-block;
    transition: color 140ms var(--ease);
  }
  nav a:hover { color: var(--fg2); }
  nav a:active { transform: scale(.97); }
  nav a[aria-current="page"] { color: var(--fg); }

  main { margin-top: 232px; }

  /* queue */
  ul { list-style: none; }
  li {
    position: relative; height: 40px; display: flex; align-items: center; justify-content: space-between;
    color: var(--fg2);
  }
  li .st { color: var(--fg3); }
  li.run .st { color: var(--fg); }
  li.fail .name { color: var(--fg); }
  li.fail .st { color: var(--fg); font-weight: 700; }

  /* the sentence */
  .say { margin-top: 72px; font-size: 15px; color: var(--fg3); position: relative;
    display: flex; align-items: baseline; gap: 0; white-space: pre; }
  .say .end { margin-left: auto; }
  .say .p { color: var(--glyph); margin-right: 10px; }
  .word {
    font-size: 15px; color: var(--fg); padding: 1px 1px;
    text-decoration: underline dotted var(--under); text-decoration-thickness: 1.5px; text-underline-offset: 5px;
    border-radius: 4px; transition: background-color 140ms var(--ease), text-decoration-color 140ms var(--ease);
  }
  .word:hover, .word[aria-expanded="true"] { background: var(--hover); text-decoration-color: var(--fg); }
  .word:active { transform: scale(.97); }

  .pop {
    position: absolute; top: 32px; display: none; min-width: 84px;
    background: var(--pop); border: 1px solid var(--popline); border-radius: 8px; padding: 4px;
  }
  .pop.open { display: block; }
  .pop button { display: block; width: 100%; text-align: left; padding: 5px 10px; border-radius: 6px; color: var(--fg3); font-size: 13px; }
  .pop button:hover { background: var(--hover); color: var(--fg); }
  .pop button[aria-selected="true"] { color: var(--fg); }

  .go {
    font: 600 15px var(--m); color: var(--fg); padding: 4px 10px; margin-right: -10px; border-radius: 6px;
    transition: background-color 140ms var(--ease), color 140ms var(--ease);
  }
  .go:hover { background: var(--fg); color: #000; }
  .go:active { transform: scale(.97); }

  /* whole window is the drop target; shown only while dragging */
  .drop { position: fixed; inset: 38px 0 0; pointer-events: none; opacity: 0;
    outline: 1px dashed #5a5a5a; outline-offset: -16px; border-radius: 12px;
    transition: opacity 140ms var(--ease); }
  body.dragging .drop { opacity: 1; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 14 14" fill="none" stroke="#b0b0b0" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2.5 2.5h9v9h-9z"/><path d="M5 7h4"/></svg>
      Filesmith
    </div>
    <div class="win">
      <button aria-label="Minimise"><svg viewBox="0 0 10 10" stroke="currentColor"><path d="M0 5.5h10"/></svg></button>
      <button aria-label="Maximise"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor"><path d="M.5.5h9v9h-9z"/></svg></button>
      <button aria-label="Close"><svg viewBox="0 0 10 10" stroke="currentColor"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </header>

  <div class="col">
    <nav aria-label="Tools">
      <a href="#" aria-current="page">convert</a>
      <a href="#">compress</a>
      <a href="#">resize</a>
      <a href="#">upscale</a>
      <a href="#">remove bg</a>
      <a href="#">generate</a>
      <a href="#">tools</a>
    </nav>

    <main>
      <ul aria-label="Queue">
        <li><span class="name">IMG_4821.HEIC</span><span class="st">done</span></li>
        <li class="run"><span class="name">screenshot.png</span><span class="st">62%</span></li>
        <li><span class="name">hero-banner.png</span><span class="st">queued</span></li>
        <li class="fail"><span class="name">scan_0091.tiff</span><span class="st">&#x2715; failed</span></li>
      </ul>
      <p class="say">
        <span class="p" aria-hidden="true">&rsaquo;</span><span>convert 4 files to </span><button class="word" id="fmt" aria-haspopup="listbox" aria-expanded="false">webp</button><span> at </span><button class="word" id="q" aria-haspopup="listbox" aria-expanded="false" aria-label="quality 80">80</button>
        <button class="go end">run &#x21B5;</button>
        <span class="pop" data-for="fmt" role="listbox">
          <button>jpg</button><button>png</button><button aria-selected="true">webp</button><button>avif</button><button>gif</button>
        </span>
        <span class="pop" data-for="q" role="listbox">
          <button>60</button><button>70</button><button aria-selected="true">80</button><button>90</button><button>100</button>
        </span>
      </p>
    </main>
  </div>
  <div class="drop" aria-hidden="true"></div>

<script>
  document.querySelectorAll('.word').forEach(w => {
    const pop = document.querySelector('.pop[data-for="' + w.id + '"]');
    w.addEventListener('click', e => {
      e.stopPropagation();
      const open = !pop.classList.contains('open');
      document.querySelectorAll('.pop').forEach(p => p.classList.remove('open'));
      document.querySelectorAll('.word').forEach(x => x.setAttribute('aria-expanded', 'false'));
      if (open) { pop.style.left = (w.offsetLeft - 11) + 'px'; pop.classList.add('open'); w.setAttribute('aria-expanded', 'true'); }
    });
    pop.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      pop.querySelectorAll('button').forEach(x => x.removeAttribute('aria-selected'));
      b.setAttribute('aria-selected', 'true');
      w.textContent = b.textContent;
      if (w.id === 'q') w.setAttribute('aria-label', 'quality ' + b.textContent);
    }));
  });
  let dc = 0;
  addEventListener('dragenter', e => { e.preventDefault(); dc++; document.body.classList.add('dragging'); });
  addEventListener('dragleave', () => { if (--dc <= 0) { dc = 0; document.body.classList.remove('dragging'); } });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); dc = 0; document.body.classList.remove('dragging'); });
  document.addEventListener('click', () => {
    document.querySelectorAll('.pop').forEach(p => p.classList.remove('open'));
    document.querySelectorAll('.word').forEach(x => x.setAttribute('aria-expanded', 'false'));
  });
</script>
</body>
</html>
