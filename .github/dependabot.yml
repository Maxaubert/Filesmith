version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # lockfile-only: the release workflow's dry run demands a NEW app version
    # whenever package.json changes, so a Dependabot PR that edited package.json
    # would always fail that check. package-lock.json is not in the dry-run
    # path list, so lockfile-only updates stay out of it.
    versioning-strategy: lockfile-only
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
