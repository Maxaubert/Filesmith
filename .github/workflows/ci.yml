name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # windows-latest, not ubuntu: the app is Windows-first and several suites
    # exercise Windows path semantics (drive letters, backslashes, reserved
    # names) that a Linux runner would never catch.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
